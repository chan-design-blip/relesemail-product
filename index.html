<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Release Email Generator — OrangeHRM</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="generator.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div>
        <div class="brand-title">Release Email Generator</div>
        <div class="brand-sub">Fill in the form — preview updates live</div>
      </div>
    </div>
    <div class="toolbar-spacer"></div>
    <div id="size-meter" class="size-meter" title="Estimated email size">
      <span class="size-meter-dot"></span>
      <span class="size-meter-value">— KB</span>
      <span class="size-meter-limit">/ 102 KB Gmail</span>
    </div>
    <button id="btn-reset" class="btn btn-ghost" type="button" title="Reset to defaults">Reset</button>
    <button id="btn-send-test" class="btn" type="button" title="Send a test email">✉ Send test</button>
    <button id="btn-copy" class="btn" type="button">Copy HTML</button>
    <button id="btn-download" class="btn btn-primary" type="button">↓ Download HTML</button>
  </header>

  <div class="workspace">
    <main id="form-pane" class="form-pane"></main>
    <aside class="preview-pane">
      <div class="preview-frame">
        <iframe id="preview-frame" class="preview-iframe" title="Email preview" sandbox="allow-same-origin allow-scripts" allow="clipboard-write"></iframe>
      </div>
    </aside>
  </div>

</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  // Server-side Gemini proxy. Point this at wherever gemini-image.php is
  // deployed. Leave it empty to hide the AI buttons entirely.
  window.RELEASE_EMAIL_CONFIG = { aiEndpoint: 'api/gemini-image.php' };
</script>
<script src="template.js"></script>
<script src="icons.js"></script>
<script src="ai.js"></script>
<script src="generator.js"></script>
<script>
  // Auto-size the preview iframe to match its content height
  (function () {
    const iframe = document.getElementById('preview-frame');
    function fit() {
      try {
        const doc = iframe.contentDocument;
        if (!doc || !doc.body) return;
        // Account for the 40px top + 40px bottom padding on the wrapper table
        const h = doc.body.scrollHeight;
        iframe.style.height = Math.max(900, h) + 'px';
      } catch (e) {}
    }
    iframe.addEventListener('load', () => {
      fit();
      // Re-fit after a tick (images, fonts settle)
      setTimeout(fit, 300);
      setTimeout(fit, 1000);
    });
  })();
</script>
</body>
</html>
